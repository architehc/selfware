# Do NOT put the real API key here; set SELFWARE_API_KEY in the environment.

endpoint = "https://openrouter.ai/api/v1"
model = "google/gemini-2.5-pro"
max_tokens = 16384
temperature = 0.1
api_key = "$SELFWARE_API_KEY"

[agent]
max_iterations = 40
step_timeout_secs = 900
token_budget = 131072
context_window = 1048576
native_function_calling = false
streaming = true
min_completion_steps = 2
require_verification_before_completion = true

[retry]
max_retries = 8
base_delay_ms = 2000
max_delay_ms = 60000

[safety]
allowed_paths = ["./**", "/app/**"]

[metadata]
tier = "large"
tool_style = "auto"
recommended = true
notes = "Large high-quality model with 1M context; expensive output tokens but powerful for big-code tasks."
