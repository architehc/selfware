# Auto-generated SWE-bench Pro tuned config from openrouter_models.toml
# Do NOT edit by hand; rerun generate_sweap_configs.py
# Do NOT put the real API key here; set SELFWARE_API_KEY in the environment.

endpoint = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.5-flash-02-23"
max_tokens = 8192
temperature = 0.1
api_key = "$SELFWARE_API_KEY"

[agent]
max_iterations = 60
step_timeout_secs = 180
token_budget = 32768
context_window = 32768
native_function_calling = false
streaming = true
min_completion_steps = 2
# Tests are run externally by the SWE-bench Pro evaluator; do not block on them.
require_verification_before_completion = false
# Force the agent to modify at least one source file before finishing.
require_edit_before_completion = true

# Minimal/cheap-model tuning: strip memory, limit tools, enforce early edit deadline.
disable_episodic_memory = true
minimal_tool_catalog = true
edit_deadline_step = 6
max_no_edit_steps = 6

[retry]
max_retries = 8
base_delay_ms = 2000
max_delay_ms = 60000

[verification]
# Disable automatic post-edit verification; SWE-bench Pro tests run externally.
disabled = true

[safety]
# Allow edits both relative to the repo CWD and via absolute /app paths.
# SWE-bench Pro extracts the target repo at /app inside the container, and
# the agent may refer to files using absolute paths.
allowed_paths = ["./**", "/app/**"]

[metadata]
tier = "small"
tool_style = "auto"
recommended = false
notes = "Minimal/cheap tuning of Qwen3.5-Flash. Early minimal runs showed missing_stderr failures; needs more investigation."
