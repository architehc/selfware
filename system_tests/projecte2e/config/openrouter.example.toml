# Example OpenRouter selfware config.
# Copy this file and replace the model name, or use one of the generated
# openrouter_<profile>.toml files in this directory.
#
# Do NOT put your real API key here. Set it via environment:
#   export SELFWARE_API_KEY="sk-or-v1-..."

endpoint = "https://openrouter.ai/api/v1"
model = "qwen/qwen3.5-flash"
max_tokens = 8192
temperature = 0.1

[agent]
max_iterations = 30
step_timeout_secs = 600
token_budget = 32768
native_function_calling = false
streaming = true
min_completion_steps = 2
require_verification_before_completion = true

[retry]
max_retries = 8
base_delay_ms = 2000
max_delay_ms = 60000

[safety]
allowed_paths = ["./**"]
