# Auto-generated from config/openrouter_models.toml
# Do NOT edit by hand; rerun generate_openrouter_configs.py
# Do NOT put the real API key here; set SELFWARE_API_KEY in the environment.

endpoint = "https://openrouter.ai/api/v1"
model = "openai/gpt-5-mini"
max_tokens = 16384
temperature = 0.1
api_key = "$SELFWARE_API_KEY"

[agent]
max_iterations = 25
step_timeout_secs = 600
token_budget = 32768
context_window = 8192
native_function_calling = false
streaming = false
min_completion_steps = 2
require_verification_before_completion = false
disable_episodic_memory = true
minimal_tool_catalog = true

[retry]
max_retries = 8
base_delay_ms = 2000
max_delay_ms = 60000

[safety]
allowed_paths = ["./**", "/app", "/app/**"]

[metadata]
tier = "small"
tool_style = "json"
recommended = false
agentless_default = true
notes = "Cheap OpenAI GPT-5 Mini; bypass multi-turn agent loop by default."
