context_window = 0
native_function_calling = false
streaming = true
min_completion_steps = 2
require_verification_before_completion = true

[retry]
max_retries = 8
base_delay_ms = 2000
max_delay_ms = 60000

[safety]
allowed_paths = ["./**", "/app/**"]

[metadata]
tier = "small"
tool_style = "auto"
recommended = false
notes = "Cheap Gemma 3 27B; untested in this harness."
