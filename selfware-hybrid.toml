# Selfware Hybrid Configuration
# 122B (SGLang) for primary work + 27B (vLLM) for long-context tasks
#
# Usage:
#   selfware -c selfware-hybrid.toml -p "Task"          # Uses 122B (default)
#   selfware -c selfware-hybrid.toml --profile long -p "Task"  # Uses 27B (1M context)

# ═════════════════════════════════════════════════════════════════
# DEFAULT: 122B SGLang (Primary Endpoint)
# ═════════════════════════════════════════════════════════════════
# Best for: Tool calling, evolution, complex reasoning, throughput

endpoint = "https://crazyshit.ngrok.io/v1"
model = "txn545/Qwen3.5-122B-A10B-NVFP4"
max_tokens = 8192
context_length = 262144
temperature = 0.6

[extra_body]
top_p = 0.95
top_k = 20
min_p = 0.0
chat_template_kwargs = { enable_thinking = false }

[agent]
token_budget = 180000
token_safety_margin = 50000
max_iterations = 50
step_timeout_secs = 600
native_function_calling = true
streaming = false
max_parallel_tools = 16

[parallel]
max_concurrency = 64
enabled = true

# ═════════════════════════════════════════════════════════════════
# PROFILE: 27B vLLM (Long-Context Endpoint)
# ═════════════════════════════════════════════════════════════════
# Best for: Large codebase analysis, documentation, long-form tasks
# Trigger: --profile long or [models.long] reference

[models.long]
endpoint = "http://localhost:8000/v1"
model = "qwen3.5-27b"
max_tokens = 8192
context_length = 1010000  # 1 MILLION tokens!
temperature = 0.6
modalities = ["text"]

# ═════════════════════════════════════════════════════════════════
# PROFILE: 27B for Evolution (Alternative Architect)
# ═════════════════════════════════════════════════════════════════
# Can be used for evolution hypotheses while 122B handles execution

[models.architect]
endpoint = "http://localhost:8000/v1"
model = "qwen3.5-27b"
max_tokens = 16384
context_length = 1010000
temperature = 0.7
modalities = ["text"]

# ═════════════════════════════════════════════════════════════════
# SAFETY & OPERATIONAL SETTINGS
# ═════════════════════════════════════════════════════════════════

[safety]
allowed_paths = ["./**", "/tmp/**", "/home/ivo/selfware/system_tests/**"]
denied_paths = ["**/.env", "**/secrets/**", "**/.git/**", "**/target/**"]
protected_branches = ["main"]

[continuous_work]
enabled = true
checkpoint_interval_tools = 10
checkpoint_interval_secs = 300
auto_recovery = true
max_recovery_attempts = 3

[retry]
max_retries = 5
base_delay_ms = 1000
max_delay_ms = 60000

[resources]
max_file_size_mb = 20
max_search_results = 200
max_context_files = 50

# ═════════════════════════════════════════════════════════════════
# EVOLUTION SETTINGS (Uses 122B for strong reasoning)
# ═════════════════════════════════════════════════════════════════

[evolution]
# Files the evolution engine can mutate
prompt_logic = [
    "src/agent/planning.rs",
    "src/agent/loop_control.rs",
    "src/agent/learning.rs",
    "src/agent/execution.rs",
]

tool_code = [
    "src/tools/file.rs",
    "src/tools/search.rs",
    "src/tools/analyzer.rs",
]

cognitive = [
    "src/cognitive/memory_hierarchy.rs",
    "src/cognitive/episodic.rs",
]

config_keys = ["temperature", "max_tokens", "token_budget"]

# Optional: Use 27B for hypothesis generation (1M context!)
# hypothesis_model = "architect"
