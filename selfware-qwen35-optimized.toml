# Optimized Configuration for Qwen/Qwen3.5-27B-FP8
# Model specs: 1M context, 81K max output, FP8 quantized
# Hardware: 2x RTX 4090 (24GB each)

endpoint = "http://localhost:8000/v1"
model = "qwen3.5-27b"
max_tokens = 81920      # Max output tokens (81,920)
context_length = 1010000 # 1M context window
temperature = 0.7

[concurrency]
max_parallel_requests = 8
max_retries = 3
timeout_secs = 600      # 10 min for long outputs

# Different sampling strategies for different task types
[sampling_modes]

# Mode 1: Thinking - General tasks (creative, exploratory)
[sampling_modes.thinking_general]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0
use_thinking = true
description = "Creative thinking with high temperature"

# Mode 2: Thinking - Precise coding (WebDev, strict syntax)
[sampling_modes.thinking_precise]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repetition_penalty = 1.0
use_thinking = true
description = "Precise coding with conservative temperature"

# Mode 3: Instruct - General tasks (factual, direct)
[sampling_modes.instruct_general]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repetition_penalty = 1.0
use_thinking = false
description = "Direct instruction following"

# Mode 4: Instruct - Reasoning (math, logic, analysis)
[sampling_modes.instruct_reasoning]
temperature = 1.0
top_p = 1.0
top_k = 40
min_p = 0.0
presence_penalty = 2.0
repetition_penalty = 1.0
use_thinking = false
description = "Maximum reasoning capability"

# Task type to sampling mode mapping
[task_type_sampling]
"code_generation" = "thinking_precise"
"bug_fix" = "thinking_precise"
"refactor" = "thinking_precise"
"web_development" = "thinking_precise"
"architecture" = "thinking_general"
"exploration" = "thinking_general"
"documentation" = "instruct_general"
"testing" = "instruct_general"
"analysis" = "instruct_reasoning"
"math" = "instruct_reasoning"
"default" = "thinking_precise"

[performance]
auto_scale = true
min_instances = 4
max_instances = 16
cache_enabled = true

[monitoring]
metrics_enabled = true
log_level = "info"

# Memory optimization for 1M context
[context_management]
# Reserve tokens for different purposes
max_context_tokens = 678928  # 67% of 1M for content
compression_threshold = 0.8   # Compress at 80% capacity
thinking_budget = 0.05        # 5% for reasoning tokens
