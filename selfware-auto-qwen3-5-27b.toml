# Auto-configured for qwen3.5-27b (vllm) on http://localhost:8000/v1
endpoint = "http://localhost:8000/v1"
model = "qwen3.5-27b"
max_tokens = 16384
context_length = 1010000
temperature = 0.6

[safety]
allowed_paths = ["./**", "/tmp/**"]
denied_paths = ["**/.env", "**/secrets/**", "**/.ssh/**"]
protected_branches = ["main"]

[agent]
max_iterations = 50
step_timeout_secs = 300
native_function_calling = true

[continuous_work]
enabled = true
checkpoint_interval_tools = 10
checkpoint_interval_secs = 300
auto_recovery = true
max_recovery_attempts = 3

# Thinking mode disabled — model consumes all tokens on reasoning
# with small max_tokens, leaving content empty.
[extra_body]
chat_template_kwargs = { enable_thinking = false }

[retry]
max_retries = 5
base_delay_ms = 1000
max_delay_ms = 60000
