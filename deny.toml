# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Only check these targets
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# The database of advisories
db-path = "~/.cargo/advisory-db"
# URL(s) of the advisory database to fetch
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore these advisories for unmaintained transitive dependencies that
# have no safe upgrade path yet.  Review periodically.
ignore = [
    # bincode 1.3.3 -- pulled in by hnsw_rs and syntect; no drop-in replacement
    "RUSTSEC-2025-0141",
    # yaml-rust 0.4.5 -- pulled in by syntect; waiting for upstream to migrate
    "RUSTSEC-2024-0320",
    # number_prefix 0.4.0 -- pulled in by indicatif
    "RUSTSEC-2025-0119",
    # paste 1.0.15 -- pulled in by tokenizers
    "RUSTSEC-2024-0436",
    # (withdrawn) advisory no longer in RustSec DB; added when ignoring unmaintained transitive deps
    "RUSTSEC-2025-0435",
    # quinn-proto DoS via invalid QUIC transport parameters (CVE-2026-31812); patched in >= 0.11.14
    "RUSTSEC-2026-0037",
    # rand 0.9.x/0.10.x: unsound only with a custom logger calling rand::rng().
    # We do not invoke rand from a custom logger; not exploitable in our use.
    "RUSTSEC-2026-0097",
    # quick-xml 0.30: only a BUILD dependency of xcb (parses xcb's own
    # bundled protocol XML at build time; not attacker-controlled input).
    # The runtime quick-xml via plist/syntect is 0.41.0 (fixed).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # h2 0.3.27 (empty DATA frames DoS, low severity): only reachable via
    # hyper 0.14/axum 0.6/tonic 0.9 from opentelemetry-otlp 0.14; patched
    # solely in h2 >= 0.4.16 and our 0.4 copy is now 0.4.19. Dropping the
    # 0.3 copy requires the opentelemetry 0.32 stack migration (tracked
    # separately). Exposure is the telemetry exporter path only.
    "RUSTSEC-2026-0258",
]
# Treat unmaintained crates as errors (all = error for any unmaintained crate)
unmaintained = "all"
# Yanked crates are errors
yanked = "deny"

[licenses]
# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
# Confidence threshold for detecting license from text
confidence-threshold = 0.8
# Allow exceptions for specific crates
exceptions = []

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"
# Lint level for when a crate is detected as a build-time dependency
wildcards = "allow"

# Specific crate denials
deny = []

# Skip specific versions (for version conflicts)
skip = []

# Skip entire dependency trees
skip-tree = []



[sources]
# Allowed registries
unknown-registry = "warn"
# Allowed git sources
unknown-git = "warn"
# List of allowed registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
