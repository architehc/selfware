<!DOCTYPE html>
<html>
<head>
    <title>Selfware IDE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
    <style>
        body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
        #toolbar { padding: 6px 10px; background: #2d2d2d; color: #ddd; display: flex; align-items: center; gap: 10px; }
        #toolbar button { background: #0e639c; color: #fff; border: none; border-radius: 3px; padding: 5px 14px; cursor: pointer; }
        #toolbar button:disabled { background: #555; cursor: default; }
        #status { font-size: 0.85em; }
        #container { display: flex; height: calc(100vh - 37px); }
        #file-tree { width: 260px; overflow-y: auto; background: #1e1e1e; color: #ccc; padding: 6px 0; }
        #file-tree div { padding: 3px 12px; cursor: pointer; white-space: nowrap; }
        #file-tree div:hover { background: #2a2d2e; }
        #file-tree div.active { background: #094771; color: #fff; }
        #editor { flex: 1; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="save-btn" disabled>Save</button>
        <span id="status"></span>
    </div>
    <div id="container">
        <div id="file-tree"></div>
        <div id="editor"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
