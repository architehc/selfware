apiVersion: apps/v1
kind: Deployment
metadata:
  name: selfware
  namespace: selfware
  labels:
    app.kubernetes.io/name: selfware
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: selfware
  template:
    metadata:
      labels:
        app.kubernetes.io/name: selfware
        app.kubernetes.io/component: toolbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: selfware
          image: selfware:latest
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
