endpoint = "http://localhost:8000/v1"
model = "qwen3.5-27b"
context_length = 128000
max_tokens = 4096
temperature = 0.7

[agent]
token_budget = 50000
token_safety_margin = 20000
max_iterations = 20

[evolution]
population_size = 3
generations = 20
prompt_logic = ["src/agent/loop_control.rs", "src/cognitive/state.rs"]
tool_code = ["src/tools/file.rs"]
cognitive = ["src/memory.rs"]
