# ==============================================================================
# Selfware Configuration: DeepSeek V4.1 Flash on llm.selfware.design
# ==============================================================================

endpoint = "https://llm.selfware.design/v1"
api_key = "EMPTY"
model = "deepseek-v4.1-flash"
# max_tokens and context_length are deliberately NOT set here: the built-in
# deepseek-v4 profile supplies the values calibrated against this endpoint
# (context_length 262,144, max_tokens 65,536, agent.max_call_secs 3,600; see
# docs/model-playbook.md). Explicit values here override the profile.

# Thinking is NOT pinned here either: the deepseek-v4 profile sends
# chat_template_kwargs {enable_thinking = true, preserve_thinking = false}
# and sets thinking and max_tokens per kind of turn (the [workloads] table;
# `selfware llm-doctor` prints it). A pin of enable_thinking under
# [extra_body.chat_template_kwargs] holds for EVERY turn and disables the
# per-turn setting (explicit wins).
# To tune one kind of turn, e.g. read turns without thinking:
#   [workloads.mechanical]
#   enable_thinking = false

[safety]
allowed_paths = ["./**"]
denied_paths = ["**/.env", "**/secrets/**", "**/.ssh/**", "**/target/**"]

[agent]
# max_iterations is not pinned: the default (400) applies. Long read-only
# reviews on this endpoint measured 91-136 turns, so 100 would cut them off.
step_timeout_secs = 1200
native_function_calling = false

[retry]
max_retries = 3
base_delay_ms = 1000
max_delay_ms = 10000
