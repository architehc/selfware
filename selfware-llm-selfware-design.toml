# ==============================================================================
# Selfware Configuration: Qwen 3.8 Flash-Next on llm.selfware.design
# ==============================================================================

endpoint = "https://llm.selfware.design/v1"
api_key = "EMPTY"
model = "qwen38-flash-next"
# max_tokens and context_length are deliberately NOT set here: the built-in
# qwen38 profile supplies the values measured against this endpoint
# (context_length 163,840, max_tokens 24,576, agent.max_call_secs 1,628; see
# docs/model-playbook.md). Explicit values here override the profile — the
# earlier 350,000 window let prompts grow past what the server serves
# (174,897 prompt tokens observed against 163,840) and the reads that fell
# off were lost server-side. Set them only if you have measured otherwise.

# Thinking is NOT pinned here either: the qwen38 profile sends
# chat_template_kwargs {enable_thinking = true, preserve_thinking = false}
# and sets thinking and max_tokens per kind of turn (the [workloads] table,
# measured 2026-09-27; `selfware llm-doctor` prints it). A pin of
# enable_thinking under [extra_body.chat_template_kwargs] holds for EVERY
# turn and disables the per-turn setting (explicit wins). reasoning_effort
# is not set: no value measurably bounds reasoning on this model ("low" and
# "xhigh" both ranged 643-8,192 reasoning tokens on one prompt), and a
# reasoning-exhausted turn's retry now switches thinking off directly.
# To tune one kind of turn, e.g. read turns without thinking (faster in
# replays, worse in live reviews — docs/model-playbook.md § 7):
#   [workloads.mechanical]
#   enable_thinking = false

[safety]
allowed_paths = ["./**"]
denied_paths = ["**/.env", "**/secrets/**", "**/.ssh/**", "**/target/**"]

[agent]
# max_iterations is not pinned: the default (400) applies. Long read-only
# reviews on this endpoint measured 91-136 turns, so 100 would cut them off.
step_timeout_secs = 600
native_function_calling = false

[retry]
max_retries = 3
base_delay_ms = 1000
max_delay_ms = 10000
