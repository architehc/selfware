# Primary preset for remote vision-heavy evaluation with a local coder fallback.
# Use this when visual verification is the critical path.

endpoint = "https://crazyshit.ngrok.io/v1"
model = "txn545/Qwen3.5-122B-A10B-NVFP4"
max_tokens = 192
context_length = 262144
temperature = 0.0

[safety]
allowed_paths = ["./**", "/tmp/**"]
denied_paths = ["**/.env", "**/secrets/**", "**/.ssh/**", "**/.git/**"]
protected_branches = ["main"]

[agent]
token_budget = 180000
token_safety_margin = 50000
max_iterations = 50
step_timeout_secs = 300
native_function_calling = false
streaming = false

[continuous_work]
enabled = true
checkpoint_interval_tools = 10
checkpoint_interval_secs = 300
auto_recovery = true
max_recovery_attempts = 3

[retry]
max_retries = 5
base_delay_ms = 1000
max_delay_ms = 60000

[extra_body]
chat_template_kwargs = { enable_thinking = false }

[models.coder]
endpoint = "http://localhost:8000/v1"
model = "qwen3.5-27b"
max_tokens = 8192
temperature = 0.2
context_length = 1010000
modalities = ["text"]

[models.coder.extra_body]
chat_template_kwargs = { enable_thinking = false }

[models.vision]
endpoint = "https://crazyshit.ngrok.io/v1"
model = "txn545/Qwen3.5-122B-A10B-NVFP4"
max_tokens = 192
temperature = 0.0
context_length = 262144
modalities = ["text", "vision"]

[models.vision.extra_body]
chat_template_kwargs = { enable_thinking = false }
