# Selfware config — Qwen3.5-122B on SGLang via ngrok
endpoint = "https://crazyshit.ngrok.io/v1"
model = "/media/thread/trebuchet6/qwen35/models/Qwen3.5-122B-A10B-NVFP4-yarn-1010k"
# 16K allows thinking + tool calls + answer without runaway generation
max_tokens = 16384
context_length = 1010000
temperature = 0.6

[extra_body]
# Enable thinking for better tool-call reasoning
chat_template_kwargs = { enable_thinking = true }

[safety]
allowed_paths = ["./**", "~/**", "/home/ivo/radarcam/**", "/home/ivo/selfware/**", "/tmp/**"]
denied_paths = ["**/.env", "**/secrets/**", "**/.ssh/**"]
protected_branches = ["main"]

[agent]
max_iterations = 100
# Generous timeout per step since model is slow (~1-4 tok/s)
step_timeout_secs = 600
# SGLang doesn't support native function calling reliably — use XML tool calling
native_function_calling = false
streaming = true

[continuous_work]
enabled = true
checkpoint_interval_tools = 10
checkpoint_interval_secs = 300
auto_recovery = true
max_recovery_attempts = 10

[retry]
max_retries = 3
base_delay_ms = 2000
max_delay_ms = 30000
