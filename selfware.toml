# Selfware config — Qwen3.5-122B on SGLang via ngrok
endpoint = "https://crazyshit.ngrok.io/v1"
model = "/media/thread/trebuchet6/qwen35/models/Qwen3.5-122B-A10B-NVFP4-yarn-1010k"
# 32K allows thinking overhead + tool calls + answer
max_tokens = 32768
context_length = 1010000
temperature = 0.6

[extra_body]
chat_template_kwargs = { enable_thinking = true }

[safety]
allowed_paths = ["./**", "~/**", "/home/ivo/radarcam/**", "/home/ivo/selfware/**", "/tmp/**"]
denied_paths = ["**/.env", "**/secrets/**", "**/.ssh/**"]
protected_branches = ["main"]

[agent]
max_iterations = 100
step_timeout_secs = 600
native_function_calling = false
streaming = true
# Reduce context pollution from ML subdirectories
# Token budget reservations
token_budget = 500000

[continuous_work]
enabled = true
checkpoint_interval_tools = 10
checkpoint_interval_secs = 300
auto_recovery = true
max_recovery_attempts = 10

[retry]
max_retries = 3
base_delay_ms = 2000
max_delay_ms = 30000

# Local fast model for quick tasks
[models.local]
endpoint = "http://localhost:9100/v1"
model = "qwen3.6"
max_tokens = 4096
context_length = 32768
