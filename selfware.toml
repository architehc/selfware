# Selfware config — gemma-4-31b on LM Studio (localhost:1234)
endpoint = "http://192.168.137.1:1234/v1"
model = "google/gemma-4-31b"
max_tokens = 4096
context_length = 131072
temperature = 0.7

[safety]
allowed_paths = ["./**", "/tmp/**"]
denied_paths = ["**/.env", "**/secrets/**", "**/.ssh/**"]
protected_branches = ["main"]

[agent]
max_iterations = 100
step_timeout_secs = 600
native_function_calling = true
streaming = true

[continuous_work]
enabled = true
checkpoint_interval_tools = 10
checkpoint_interval_secs = 300
auto_recovery = true
max_recovery_attempts = 10

[retry]
max_retries = 5
base_delay_ms = 1000
max_delay_ms = 60000

[models.embedding]
endpoint = "http://192.168.137.1:1234/v1"
model = "text-embedding-nomic-embed-text-v1.5"
context_length = 768  # embedding dimension
