# Selfware Evolution Configuration - External 122B Model
# Model: /media/thread/trebuchet6/qwen35/models/Qwen3.5-122B-A10B-NVFP4-yarn-1010k
# Endpoint: https://crazyshit.ngrok.io/v1
# Context: 1,010,000 tokens

endpoint = "https://crazyshit.ngrok.io/v1"
model = "/media/thread/trebuchet6/qwen35/models/Qwen3.5-122B-A10B-NVFP4-yarn-1010k"
max_tokens = 8192
context_length = 1010000
temperature = 0.6

# Qwen3.5 sampling parameters
[extra_body]
top_p = 0.95
top_k = 20
min_p = 0.0
# Disable thinking for tool-heavy workflows
chat_template_kwargs = { enable_thinking = false }

[agent]
# Token budget for 1M context
# 1M - 50K safety - 50K tools = ~900K for messages
token_budget = 942000
token_safety_margin = 50000
max_iterations = 50
step_timeout_secs = 600
native_function_calling = false
streaming = false

[evolution]
# Files the evolution engine can mutate
prompt_logic = [
    "src/agent/planning.rs",
    "src/agent/loop_control.rs",
    "src/agent/learning.rs",
    "src/agent/execution.rs",
    "src/agent/context_management.rs",
]

tool_code = [
    "src/tools/file.rs",
    "src/tools/search.rs",
    "src/tools/analyzer.rs",
    "src/tools/shell.rs",
    "src/tools/cargo.rs",
]

cognitive = [
    "src/cognitive/memory_hierarchy/mod.rs",
    "src/cognitive/episodic.rs",
    "src/cognitive/self_improvement.rs",
]

config_keys = ["temperature", "max_tokens", "token_budget"]

[safety]
allowed_paths = ["./**", "/tmp/**", "/home/ivo/selfware/system_tests/**"]
denied_paths = ["**/.env", "**/secrets/**", "**/target/**", "**/.git/**"]
