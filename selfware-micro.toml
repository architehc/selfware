# Minimal Evolution Configuration for Qwen3.5-0.8B
# Designed for: llmfit, llama.cpp on CPU, edge devices
# Strategy: Small context, single-file mutations, high iterations

endpoint = "http://localhost:8080/v1"
model = "qwen3.5-0.8b"  # Will match various naming conventions
context_length = 16384   # Minimal - works on 8GB RAM systems
max_tokens = 2048        # Short, focused outputs
temperature = 0.3        # Lower = more deterministic for small models

[agent]
max_iterations = 20
step_timeout_secs = 60
token_budget = 8000      # Very small working memory
token_safety_margin = 2000

# Evolution settings optimized for tiny models
[evolution]
# Single-file mutations only - 0.8B can't handle multi-file reasoning
prompt_logic = ["src/cognitive/state.rs"]
tool_code = ["src/tools/file.rs"]
cognitive = []

# Config keys the agent may tune (limited set for small models)
config_keys = ["temperature"]

[evolution.llm]
# Override with micro-optimized settings
max_tokens = 2048
temperature = 0.3
# Enable thinking for 0.8B - it needs the extra reasoning
enable_thinking = true
