name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # Windows leg skipped per maintainer decision (2026-07-17): runner
        # cancellations kept blocking end-to-end validation. Re-add
        # windows-2022 (90m timeout) when wanted.
        os: [ubuntu-24.04, macos-14]
        rust: [stable]
        include:
          - os: ubuntu-24.04
            timeout: 45
          - os: macos-14
            timeout: 45
        exclude:
          # Only test beta on Linux to save CI time
          - os: macos-14
            rust: beta

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Build
        run: cargo build --verbose

      - name: Run unit tests
        run: cargo test --verbose

      - name: Run tests with all features
        run: cargo test --features extras --verbose

      - name: Build release
        run: cargo build --release --verbose

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --features extras -- -D warnings

        # The extras pass above does not cover the system-tests/redis/etc.
        # feature set — lint it separately so those targets can't rot unseen.
      - name: Run clippy (system-tests features)
        run: cargo clippy --all-targets --features system-tests -- -D warnings

  test-no-default-features:
    name: Test (no default features)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nodefault-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-nodefault-

      - name: Build (no default features)
        run: cargo build --no-default-features

      - name: Test (no default features)
        run: cargo test --no-default-features

  # NOTE: a Linux-based aarch64-apple-darwin cross-check is not viable:
  # ring's build script compiles C even under `cargo check`, which needs an
  # Apple toolchain. The macos-14 test job already covers macOS compilation.

  # Minimum supported Rust version
  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-24.04
    # A cold build + two full `cargo test` runs on 1.95 plus the cache-save
    # post-step exceeded 15m (build/tests passed but the job was cancelled
    # mid cache upload). Match the other Test jobs' 30m budget.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run tests with all features
        run: cargo test --features extras --verbose

  # Performance benchmarks
  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Compile benchmarks
        run: cargo bench --features extras --no-run

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --no-deps --features extras
        env:
          RUSTDOCFLAGS: -D warnings

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        # RUSTSEC-2026-0194/0195: quick-xml 0.30 remains only as a BUILD
        # dependency of xcb (bundled XML, not attacker input); runtime
        # copy via plist/syntect is 0.41.0 (fixed).
        run: cargo audit --ignore RUSTSEC-2024-0320 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0435 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2026-0037 --ignore RUSTSEC-2026-0097 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0258

  # Coverage (runs on main and PRs)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    # Coverage via cargo-llvm-cov (source-based instrumentation) rather than
    # tarpaulin: no ptrace, so it is faster and free of tarpaulin's flaky
    # child-reaping (which was cancelling the run at the 30m mark). A warm
    # Swatinem/rust-cache keeps this well under the budget after the first run.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Tests run single-threaded (as they did under tarpaulin) to avoid the
      # suite's process-global cwd / port-bind races. One instrumented run,
      # then cheap `report` renders reuse the collected profile data.
      - name: Generate coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --features extras --no-report -- --test-threads 1
          cargo llvm-cov report --cobertura --output-path coverage/cobertura.xml
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --summary-only | tee coverage/summary.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # llvm-cov measures 64.48% line coverage today. The floor ratchets UP as
      # real coverage improves, 5 points per milestone toward 75 (step 2 = 65
      # requires actually adding coverage first).
      - name: Enforce coverage floor
        run: cargo llvm-cov report --summary-only --fail-under-lines 60

  # Dependency policy (advisories, licenses, bans) — configured in deny.toml
  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check
