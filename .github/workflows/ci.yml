name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Dev/test builds keep file:line debug info (panics and RUST_BACKTRACE
  # still resolve) but skip full variable/type debuginfo, which dominates
  # link time and cache size for the ~20 test binaries.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

permissions:
  contents: read

jobs:
  # Default-features and extras passes run as parallel matrix legs rather than
  # back to back in one job (measured on 686810b2: macos-14 ran build 5m +
  # `cargo test` 30m + `cargo test --features extras` 26m + release build 10m
  # serially = 73m). Same OS x feature configurations as before; the release
  # build moved to its own job (`build-release`) and the red-team corpus gate
  # to `redteam-gate`.
  test:
    name: Test ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    # One cold build + one test pass per leg (~30m on macos-14, ~15m on
    # ubuntu, from the 686810b2 step timings); 60m leaves 2x headroom.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows leg skipped per maintainer decision (2026-07-17): runner
        # cancellations kept blocking end-to-end validation. Re-add
        # windows-2022 when wanted.
        os: [ubuntu-24.04, macos-14]
        features: [default, extras]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        if: matrix.features == 'default'
        run: cargo build --verbose

      # The red-team corpus gate (multi-minute per pass) runs once per OS in
      # the `redteam-gate` job; every other test runs here.
      - name: Run unit tests
        if: matrix.features == 'default'
        run: cargo test --verbose -- --skip redteam_corpus_respects_gate_expectations

      - name: Run tests with all features
        if: matrix.features == 'extras'
        run: cargo test --features extras --verbose -- --skip redteam_corpus_respects_gate_expectations

  # Moved out of the test matrix so it runs in parallel with the test passes
  # (7m ubuntu / 10m macos cold on 686810b2).
  build-release:
    name: Build release ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --release --verbose

  # Red-team corpus gate (tests/redteam_gate_test.rs, ~250k-line corpus).
  # It used to run inside every `cargo test` pass (7 times per CI run, 4-8m
  # each). It now runs here once per OS -- path_validator has linux- and
  # macos-specific code, so both OSes keep it -- and the other test jobs
  # `--skip` it. The checker it drives has no feature-gated code, so one
  # default-features run per OS covers it. opt-level 2 makes the corpus pass
  # fast; debug-assertions and overflow-checks stay on (dev profile).
  redteam-gate:
    name: Red-team corpus gate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: redteam-opt2
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run red-team corpus gate
        run: cargo test --verbose --test redteam_gate_test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test release and evaluation integrity
        run: |
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/redteam_wave_pipeline.sh
          bash -n benchmarks/harbor/harness-search.sh

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --features extras -- -D warnings

        # The extras pass above does not cover the system-tests/redis/etc.
        # feature set — lint it separately so those targets can't rot unseen.
      - name: Run clippy (system-tests features)
        run: cargo clippy --all-targets --features system-tests -- -D warnings

  test-no-default-features:
    name: Test (no default features)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: nodefault
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (no default features)
        run: cargo build --no-default-features

      # Red-team corpus gate: see the `redteam-gate` job.
      - name: Test (no default features)
        run: cargo test --no-default-features -- --skip redteam_corpus_respects_gate_expectations

  # NOTE: a Linux-based aarch64-apple-darwin cross-check is not viable:
  # ring's build script compiles C even under `cargo check`, which needs an
  # Apple toolchain. The macos-14 test job already covers macOS compilation.

  # Minimum supported Rust version
  msrv:
    name: MSRV (1.95.0) / ${{ matrix.features }}
    runs-on: ubuntu-24.04
    # The two `cargo test` passes (22m + 22m on 686810b2, ~8m of each the
    # red-team corpus gate) run as parallel legs; the corpus gate runs in
    # `redteam-gate`. One cold build + one pass is ~17m per leg.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        features: [default, extras]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        if: matrix.features == 'default'
        run: cargo build --verbose

      - name: Run tests
        if: matrix.features == 'default'
        run: cargo test --verbose -- --skip redteam_corpus_respects_gate_expectations

      - name: Run tests with all features
        if: matrix.features == 'extras'
        run: cargo test --features extras --verbose -- --skip redteam_corpus_respects_gate_expectations

  # Performance benchmarks
  bench:
    name: Benchmarks
    runs-on: ubuntu-24.04
    # Cold-cache `cargo bench --no-run` (full workspace + criterion) needs
    # ~20 min; 15 timed out whenever Cargo.lock changes busted the cache key.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile benchmarks
        run: cargo bench --features extras --no-run

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --no-deps --features extras
        env:
          RUSTDOCFLAGS: -D warnings

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        # RUSTSEC-2026-0194/0195: quick-xml 0.30 remains only as a BUILD
        # dependency of xcb (bundled XML, not attacker input); runtime
        # copy via plist/syntect is 0.41.0 (fixed).
        run: cargo audit --ignore RUSTSEC-2024-0320 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0435 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2026-0037 --ignore RUSTSEC-2026-0097 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0258

  # Coverage (runs on main and PRs)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    # Coverage via cargo-llvm-cov (source-based instrumentation) rather than
    # tarpaulin: no ptrace, so it is faster and free of tarpaulin's flaky
    # child-reaping (which was cancelling the run at the 30m mark). A warm
    # Swatinem/rust-cache keeps this well under the budget after the first run.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: llvm-cov

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Lib unit tests run single-threaded (as they did under tarpaulin) to
      # avoid the suite's process-global cwd / port-bind races. The bins and
      # integration-test binaries run at default parallelism, as they do in
      # every Test job (single-threaded, `evolve` alone took 14m on 686810b2).
      # Both `--no-report` runs accumulate into one profile (the red-team
      # corpus gate is included here, so the line-coverage figure is
      # unchanged), then cheap `report` renders reuse it.
      # `--test <name>` per integration target: `--tests` would re-run the lib
      # and `--test '*'` errors on targets whose required-features (e.g.
      # `integration`) extras does not enable, so the list is the test
      # targets whose required-features the default+extras set satisfies.
      - name: Generate coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov clean --workspace
          cargo llvm-cov --features extras --no-report --lib -- --test-threads 1
          mapfile -t integration_tests < <(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          pkg = next(p for p in json.load(sys.stdin)["packages"] if p["name"] == "selfware")
          on, todo = set(), ["default", "extras"]
          while todo:
              f = todo.pop()
              if f in pkg["features"] and f not in on:
                  on.add(f)
                  todo += pkg["features"][f]
          for t in pkg["targets"]:
              if "test" in t["kind"] and set(t.get("required-features", [])) <= on:
                  print("--test=" + t["name"])
          ')
          if [ "${#integration_tests[@]}" -eq 0 ]; then
            echo "::error::no integration test targets found for coverage"
            exit 1
          fi
          echo "integration test targets: ${integration_tests[*]}"
          cargo llvm-cov --features extras --no-report --bins "${integration_tests[@]}"
          cargo llvm-cov report --cobertura --output-path coverage/cobertura.xml
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --summary-only | tee coverage/summary.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # llvm-cov measures 64.48% line coverage today. The floor ratchets UP as
      # real coverage improves, 5 points per milestone toward 75 (step 2 = 65
      # requires actually adding coverage first).
      - name: Enforce coverage floor
        run: cargo llvm-cov report --summary-only --fail-under-lines 60

  # Dependency policy (advisories, licenses, bans) — configured in deny.toml
  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check
