name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  id-token: write  # Required for cosign keyless signing

jobs:
  resolve:
    name: Resolve release revision
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout release resolver
        uses: actions/checkout@v6
      # Review finding: a manual dispatch could name a tag pointing at one
      # commit while building artifacts from the dispatch revision. Bind the
      # whole workflow to ONE immutable SHA up front: the existing tag's
      # commit, or the current revision when the tag will be created by the
      # release step. Every checkout below uses this SHA.
      - name: Resolve tag to immutable commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/resolve_release.py

      # Preserve the checker from the workflow revision. A manual dispatch may
      # resolve an older tag whose checkout predates this validation command.
      - name: Stage release version checker
        run: cp scripts/resolve_release.py "$RUNNER_TEMP/resolve_release.py"

      - name: Checkout resolved release revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Require tag to match Cargo package version
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: python3 "$RUNNER_TEMP/resolve_release.py" --validate-version "$RELEASE_TAG" Cargo.toml

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            name: selfware-linux-x86_64

          # Linux aarch64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            name: selfware-linux-aarch64
            cross: true

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-14
            archive: zip
            name: selfware-macos-aarch64

          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-14
            archive: zip
            name: selfware-macos-x86_64

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
            name: selfware-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Install system dependencies (Linux native)
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-composite0-dev pkg-config

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          # libc6:arm64 must match the runner's amd64 libc6 exactly; the runner
          # takes it from jammy-security, so arm64 needs that pocket too
          # (v0.7.3 first run: "libc6:arm64 (>= 2.34) is not going to be installed").
          echo "deb [arch=arm64] http://ports.ubuntu.com/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config \
            libdbus-1-dev:arm64 libxcb1-dev:arm64 libxcb-randr0-dev:arm64 \
            libxcb-shm0-dev:arm64 libxcb-composite0-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --features extras,vendored-openssl --target ${{ matrix.target }}

      - name: Prepare archive (Linux tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/${{ matrix.target }}/release/selfware dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cp selfware.example.toml dist/selfware.toml.example 2>/dev/null || true
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            mkdir -p dist/bin
            LLAMA_URL="https://github.com/ggml-org/llama.cpp/releases/download/b12110/llama-b12110-bin-ubuntu-x64.tar.gz"
            LLAMA_SHA="368227edcc229be5f9bed16a2223d79b5e41d0ac2e19bcf5825e82291c060e55"
            curl -fSL --retry 3 --retry-delay 2 "$LLAMA_URL" -o llama-linux.tar.gz
            echo "${LLAMA_SHA}  llama-linux.tar.gz" | sha256sum -c -
            tar -xzf llama-linux.tar.gz --strip-components=1 -C dist/bin
            ./dist/selfware --version
            ./dist/selfware boot --cards >/dev/null
            ./dist/bin/llama-server --version
          fi
          cd dist
          tar -czvf ../${{ matrix.name }}.tar.gz *

      - name: Prepare archive (macOS zip)
        if: matrix.archive == 'zip' && matrix.os != 'windows-2022'
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          cp target/${{ matrix.target }}/release/selfware dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cp selfware.example.toml dist/selfware.toml.example 2>/dev/null || true
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            LLAMA_URL="https://github.com/ggml-org/llama.cpp/releases/download/b12110/llama-b12110-bin-macos-arm64.tar.gz"
            LLAMA_SHA="4f5b8de12e0b9516658ca6a5764c6ffb3d7c659c3dd538556b1413c7b4050662"
          else
            LLAMA_URL="https://github.com/ggml-org/llama.cpp/releases/download/b12110/llama-b12110-bin-macos-x64.tar.gz"
            LLAMA_SHA="c8094268b6bf62f4998f0e45656fd9f5e2d4afb6b1cd0044d761db64be1dd47d"
          fi
          curl -fSL --retry 3 --retry-delay 2 "$LLAMA_URL" -o llama-macos.tar.gz
          echo "${LLAMA_SHA}  llama-macos.tar.gz" | shasum -a 256 -c -
          tar -xzf llama-macos.tar.gz --strip-components=1 -C dist/bin
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            ./dist/selfware --version
            ./dist/selfware boot --cards >/dev/null
            ./dist/bin/llama-server --version
          fi
          cd dist
          zip -ry ../${{ matrix.name }}.zip *

      - name: Prepare archive (Windows zip + hotpatch with bundled engine & model)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force -Path dist/bin
          New-Item -ItemType Directory -Force -Path dist/models
          Copy-Item "target/${{ matrix.target }}/release/selfware.exe" -Destination "dist/"
          Copy-Item "README.md" -Destination "dist/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" -Destination "dist/" -ErrorAction SilentlyContinue
          Copy-Item "selfware.example.toml" -Destination "dist/selfware.toml.example" -ErrorAction SilentlyContinue

          # Bundle llama-server.exe + CPU runtime DLLs (llama.cpp b12110)
          $llamaUrl = "https://github.com/ggml-org/llama.cpp/releases/download/b12110/llama-b12110-bin-win-cpu-x64.zip"
          $llamaSha = "98901e327c252875accaf2d1bf364e10e868843b0b63468baad1aa945cdc5da2"
          & curl.exe -fSL --retry 3 --retry-delay 2 $llamaUrl -o "llama-win.zip"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download llama.cpp Windows runtime"
          }
          $actualLlamaSha = (Get-FileHash -Path "llama-win.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actualLlamaSha -ne $llamaSha) {
            throw "llama.cpp SHA256 mismatch: expected $llamaSha, got $actualLlamaSha"
          }
          Expand-Archive -Path "llama-win.zip" -DestinationPath "llama-extracted" -Force
          $runtimePatterns = @(
            "llama-server.exe",
            "llama-server-impl.dll",
            "llama-common.dll",
            "llama.dll",
            "mtmd.dll",
            "ggml*.dll",
            "libomp.dll",
            "LICENSE-LLVM-OpenMP"
          )
          foreach ($pattern in $runtimePatterns) {
            Get-ChildItem -Path "llama-extracted" -Filter $pattern -Recurse | Copy-Item -Destination "dist/bin/" -Force
          }

          # Smoke-test packaged Windows executables and DLL linkage on windows-2022 before archiving
          & .\dist\selfware.exe --version
          if ($LASTEXITCODE -ne 0) { throw "selfware.exe --version failed" }
          & .\dist\selfware.exe boot --cards | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "selfware.exe boot --cards failed" }
          & .\dist\bin\llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw "llama-server.exe --version failed (missing DLL or bad binary)" }

          # 1. Lightweight Windows hotpatch archive (selfware.exe + bundled llama-server LFM3 GSQ/SLQ CPU runner)
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.name }}-hotpatch.zip" -Force

          # 2. Full Windows release archive (selfware.exe + bundled llama-server + functiongemma-270m-it-UD-Q6_K_XL.gguf support system model)
          $modelUrl = "https://huggingface.co/unsloth/functiongemma-270m-it-GGUF/resolve/main/functiongemma-270m-it-UD-Q6_K_XL.gguf"
          $modelSha = "906f29fc5343b33a8d7d5ccd7433a82d8d3cefe61893825ca0e504c402add759"
          $modelDest = "dist/models/functiongemma-270m-it-UD-Q6_K_XL.gguf"
          & curl.exe -fSL --retry 3 --retry-delay 2 $modelUrl -o $modelDest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download functiongemma-270m-it-UD-Q6_K_XL.gguf"
          }
          $actualModelSha = (Get-FileHash -Path $modelDest -Algorithm SHA256).Hash.ToLower()
          if ($actualModelSha -ne $modelSha) {
            throw "Model SHA256 mismatch: expected $modelSha, got $actualModelSha"
          }
          Compress-Archive -Path "dist/*" -DestinationPath "${{ matrix.name }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}*.${{ matrix.archive }}
          retention-days: 30

  sbom:
    name: Generate SBOM
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.7 --locked

      - name: Generate target-aligned CycloneDX SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          while read -r target artifact; do
            rm -f selfware.cdx.json
            cargo cyclonedx --format json \
              --features extras,vendored-openssl \
              --target "$target"
            test -f selfware.cdx.json
            mv selfware.cdx.json "sbom/${artifact}.sbom.cdx.json"
          done <<'TARGETS'
          x86_64-unknown-linux-gnu selfware-linux-x86_64
          aarch64-unknown-linux-gnu selfware-linux-aarch64
          aarch64-apple-darwin selfware-macos-aarch64
          x86_64-apple-darwin selfware-macos-x86_64
          x86_64-pc-windows-msvc selfware-windows-x86_64
          TARGETS

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*.sbom.cdx.json

  release:
    name: Create Release
    needs: [build, sbom, resolve]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Get version from tag
        id: version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          name: Selfware ${{ steps.version.outputs.version }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/selfware-linux-x86_64/selfware-linux-x86_64.tar.gz
            artifacts/selfware-linux-aarch64/selfware-linux-aarch64.tar.gz
            artifacts/selfware-macos-aarch64/selfware-macos-aarch64.zip
            artifacts/selfware-macos-x86_64/selfware-macos-x86_64.zip
            artifacts/selfware-windows-x86_64/selfware-windows-x86_64.zip
            artifacts/selfware-windows-x86_64/selfware-windows-x86_64-hotpatch.zip
            artifacts/sbom/selfware-linux-x86_64.sbom.cdx.json
            artifacts/sbom/selfware-linux-aarch64.sbom.cdx.json
            artifacts/sbom/selfware-macos-aarch64.sbom.cdx.json
            artifacts/sbom/selfware-macos-x86_64.sbom.cdx.json
            artifacts/sbom/selfware-windows-x86_64.sbom.cdx.json

  verify-release:
    name: Verify signed release assets are downloadable
    needs: [sign-release, resolve]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Get version
        id: version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # Regression guard: fail if any shipped archive, target-aligned SBOM or
      # keyless-signing evidence is missing from the release.
      - name: Download every expected asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(
            selfware-linux-x86_64.tar.gz
            selfware-linux-aarch64.tar.gz
            selfware-macos-aarch64.zip
            selfware-macos-x86_64.zip
            selfware-windows-x86_64.zip
            selfware-windows-x86_64-hotpatch.zip
            selfware-linux-x86_64.sbom.cdx.json
            selfware-linux-aarch64.sbom.cdx.json
            selfware-macos-aarch64.sbom.cdx.json
            selfware-macos-x86_64.sbom.cdx.json
            selfware-windows-x86_64.sbom.cdx.json
          )
          for asset in "${assets[@]}"; do
            for suffix in "" .sig .cert; do
              expected="${asset}${suffix}"
              echo "checking $expected"
              gh release download "$RELEASE_TAG" \
                --repo "${{ github.repository }}" \
                -p "$expected" --dir /tmp/verify-assets --clobber
            done
          done
          ls -la /tmp/verify-assets

  sign-release:
    name: Sign Release Artifacts
    needs: [release, resolve]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for keyless signing
      contents: write  # Required to attach signatures to release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Sign release artifacts
        run: |
          set -euo pipefail
          mapfile -d '' files < <(
            find artifacts -type f ! -name '*.sig' ! -name '*.cert' -print0
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Signing $file..."
            cosign sign-blob --yes "$file" --output-signature "${file}.sig" --output-certificate "${file}.cert"
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload signatures to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          files: |
            artifacts/selfware-*/*.sig
            artifacts/selfware-*/*.cert
            artifacts/sbom/*.sig
            artifacts/sbom/*.cert
