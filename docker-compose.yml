version: '3.8'

# Selfware Docker Compose - 2x RTX 4090 Setup
# 
# This compose file sets up selfware containers that connect to a
# remote multimodal LLM endpoint via ngrok.
#
# Endpoint: https://crazyshit.ngrok.io/v1
# Model: txn545/Qwen3.5-122B-A10B-NVFP4 (Multimodal)
# Max Context: 262144 tokens
#
# Prerequisites:
# - Docker with NVIDIA runtime (for GPU support)
#
# Quick Start:
#   ./docker-selfware.sh build && ./docker-selfware.sh start

services:
  # Main selfware service - interactive CLI
  selfware:
    build:
      context: .
      dockerfile: Dockerfile.selfware
    image: selfware:latest
    container_name: selfware
    # Network mode host for accessing local services if needed
    # (LLM endpoint is remote via HTTPS)
    network_mode: host
    environment:
      # Remote multimodal LLM endpoint
      - SELFWARE_ENDPOINT=https://crazyshit.ngrok.io/v1
      - SELFWARE_MODEL=txn545/Qwen3.5-122B-A10B-NVFP4
      - SELFWARE_MAX_TOKENS=262144
      - SELFWARE_TIMEOUT=300
      # CUDA settings (for any GPU operations inside container)
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0,1
      # Optional: OpenRouter fallback
      # - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      # Mount current directory for file operations
      - .:/workspace:rw
      # Results directory
      - ./results:/results:rw
      # Checkpoints for long-running tasks
      - ./checkpoints:/checkpoints:rw
      # Browser data persistence
      - browser-data:/root/.cache/ms-playwright
    working_dir: /workspace
    stdin_open: true
    tty: true
    # Keep container running
    command: tail -f /dev/null
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Batch processing worker service
  batch-worker:
    build:
      context: .
      dockerfile: Dockerfile.selfware
    image: selfware:latest
    network_mode: host
    environment:
      - SELFWARE_ENDPOINT=https://crazyshit.ngrok.io/v1
      - SELFWARE_MODEL=txn545/Qwen3.5-122B-A10B-NVFP4
      - SELFWARE_MAX_TOKENS=262144
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/workspace:rw
      - ./batch_tasks:/tasks:ro
      - ./batch_results:/results:rw
      - ./checkpoints:/checkpoints:rw
    working_dir: /workspace
    # Run batch processing and exit
    command: >
      batch -f /tasks/tasks.txt 
            -w ${BATCH_WORKERS:-16} 
            -t ${BATCH_TIMEOUT:-300}
            --output /results
    profiles:
      - batch

  # Visual validation service
  visual-validator:
    build:
      context: .
      dockerfile: Dockerfile.selfware
    image: selfware:latest
    network_mode: host
    environment:
      - SELFWARE_ENDPOINT=https://crazyshit.ngrok.io/v1
      - SELFWARE_MODEL=txn545/Qwen3.5-122B-A10B-NVFP4
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/workspace:rw
      - ./websites:/websites:rw
      - ./validation_results:/results:rw
    working_dir: /workspace
    command: validate -u ${VALIDATE_URL:-http://localhost:8080} -o /results
    profiles:
      - validate

  # SWE-bench evaluation service
  swebench:
    build:
      context: .
      dockerfile: Dockerfile.selfware
    image: selfware:latest
    network_mode: host
    environment:
      - SELFWARE_ENDPOINT=https://crazyshit.ngrok.io/v1
      - SELFWARE_MODEL=txn545/Qwen3.5-122B-A10B-NVFP4
      - SELFWARE_MAX_TOKENS=262144
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/workspace:rw
      - ./swebench_results:/results:rw
      - ./checkpoints:/checkpoints:rw
      - swebench-cache:/root/.cache/swebench
    working_dir: /workspace
    command: >
      swe-bench -d ${SWEBENCH_DATASET:-public} 
                -l ${SWEBENCH_LIMIT:-10}
                -o /results
    profiles:
      - swebench

  # Test runner service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.selfware
    image: selfware:latest
    network_mode: host
    environment:
      - SELFWARE_ENDPOINT=https://crazyshit.ngrok.io/v1
      - SELFWARE_MODEL=txn545/Qwen3.5-122B-A10B-NVFP4
    volumes:
      - .:/workspace:rw
      - ./test_results:/results:rw
    working_dir: /workspace
    command: test -p workflow --format ${TEST_FORMAT:-pretty}
    profiles:
      - test

  # Optional: Test web server for validation demos
  nginx-test:
    image: nginx:alpine
    container_name: selfware-nginx-test
    network_mode: host
    volumes:
      - ./test_website:/usr/share/nginx/html:ro
    profiles:
      - test-server

volumes:
  browser-data:
    driver: local
  swebench-cache:
    driver: local
